name: Blog Dispatch

on:
  schedule:
    # The Abvorn Dispatch: one new post every Friday 06:45 UTC.
    - cron: "45 6 * * 5"
  workflow_dispatch:
    inputs:
      persona:
        description: "Persona id (empty = next unused topic)"
        required: false
        type: string

permissions:
  contents: write

# Shared lock with the content/daily/expansion/auto-heal cycles so a dispatch
# never edits docs/ or data/ while another cycle is mid-commit.
concurrency:
  group: content-cycle-lock
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate + render The Abvorn Dispatch
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GLM_KEYS: ${{ secrets.GLM_KEYS }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.persona }}" ]; then ARGS="$ARGS --persona ${{ inputs.persona }}"; fi
          python scripts/build_blog.py --generate --build $ARGS

      - name: Guard: no mojibake before commit
        run: |
          python scripts/check_publish_content.py

      - name: Commit and push changes
        run: |
          git config user.name "Abvorn Bot"
          git config user.email "bot@abvorn.com"
          for p in docs/ data/; do
            [ -e "$p" ] && git add "$p"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: blog dispatch $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Notify failure on Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=dYs" <b>Blog Dispatch</b> failed on ${GITHUB_REF} (run #${GITHUB_RUN_NUMBER}). Logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -d "parse_mode=HTML"