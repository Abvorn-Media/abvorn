name: CI

on:
  push:
    branches: [main]
    # The daemon publishes content by pushing docs/ straight to main, several
    # commits per minute during a deploy burst. Those commits carry no code, so
    # don't spend a CI run on them: they would each cancel or queue the run that
    # actually verifies the code. Every deploy commit in the last 120 touches
    # docs/ and nothing else.
    paths-ignore:
      - 'docs/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # false, like every other workflow in this repo. With true, each daemon push
  # cancelled the run in flight, so the pytest job (which needs a dependency
  # install plus the full suite) never got far enough to report on main.
  cancel-in-progress: false

jobs:
  lint:
    name: Lint (ruff F/E9)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install ruff
        run: python -m pip install ruff
      - name: Run ruff
        run: python -m ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF render system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio pytest-timeout
      - name: Run pytest
        run: python -m pytest tests -q --timeout=180

  security:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit requirements
        run: python -m pip_audit -r requirements.txt --progress-spinner off